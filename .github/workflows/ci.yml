name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    # Home self-hosted runners (server-dev1/server-dev2, F-0704): no shellcheck
    # preinstalled and no passwordless sudo to apt-install it, so fetch the
    # static release binary into $RUNNER_TEMP (cleared by the runner between
    # jobs) instead. Pinned to v0.9.0 to match what ubuntu-24.04's apt repo
    # used to ship — it's stricter on SC2015 than 0.11. Moving to a newer
    # version is a deliberate change.
    runs-on: [self-hosted, home]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install shellcheck v0.9.0
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/koalaman/shellcheck/releases/download/v0.9.0/shellcheck-v0.9.0.linux.x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/shellcheck-v0.9.0/shellcheck" "$RUNNER_TEMP/bin/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Show shellcheck version
        run: shellcheck --version
      - name: Run shellcheck on all shell scripts
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 --no-run-if-empty shellcheck --severity=style

  actionlint:
    name: actionlint
    # Home self-hosted runner: Go isn't preinstalled, so set it up with the
    # official action (user-space install, no sudo needed) instead of relying
    # on the ubuntu-24.04 image. Cache disabled: `go run pkg@version` has no
    # go.sum for setup-go to key on, and the shared runner disk is small
    # (~20 GB across all crew repos' jobs) — don't grow an unused cache.
    runs-on: [self-hosted, home]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Lint workflows
        # `go run module@version` fetches a fixed release, verified against the
        # Go checksum database (sum.golang.org).
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  gitleaks:
    name: gitleaks
    # gitleaks/gitleaks-action is a Docker container action; on the home
    # runners it started failing the scan step outright (no leak annotation,
    # just a failed step) right after the self-hosted move, most likely
    # Docker Hub's anonymous pull-rate limit shared across every crew repo's
    # jobs on these two boxes. A local `gitleaks detect` against this repo's
    # full history (same version the action wraps) finds nothing, so this
    # isn't a real secret. Fetch the static binary instead, same pattern as
    # the shellcheck job above: no Docker, no GITHUB_TOKEN needed either.
    runs-on: [self-hosted, home]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks v8.18.4
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Show gitleaks version
        run: gitleaks version
      - name: Scan for committed secrets
        run: gitleaks detect --source . --redact -v

  smoke:
    name: script smoke test
    runs-on: [self-hosted, home]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Syntax check every script (bash -n)
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 --no-run-if-empty -n1 bash -n
      - name: Smoke test self-test (goes red on each F-0024 failure mode)
        run: bash scripts/test-smoke-selftest.sh
      - name: Smoke each entrypoint (--help, no sudo) and README symlink targets
        run: bash scripts/test-smoke.sh
