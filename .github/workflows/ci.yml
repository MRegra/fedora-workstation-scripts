name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    # Pinned runner image: shellcheck comes from its apt repo, so the image
    # decides the version (ubuntu-24.04 ships 0.9.x, stricter on SC2015 than
    # 0.11). Moving to a newer image is a deliberate change.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show shellcheck version
        run: shellcheck --version
      - name: Run shellcheck on all shell scripts
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 --no-run-if-empty shellcheck --severity=style

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint workflows
        # `go run module@version` fetches a fixed release, verified against the
        # Go checksum database (sum.golang.org).
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: script smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Syntax check every script (bash -n)
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 --no-run-if-empty -n1 bash -n
      - name: Smoke test self-test (goes red on each F-0024 failure mode)
        run: bash scripts/test-smoke-selftest.sh
      - name: Smoke each entrypoint (--help, no sudo) and README symlink targets
        run: bash scripts/test-smoke.sh
