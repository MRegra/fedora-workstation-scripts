name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    # Home self-hosted runners (server-dev1/server-dev2, F-0704): no shellcheck
    # preinstalled and no passwordless sudo to apt-install it, so fetch the
    # static release binary into $RUNNER_TEMP (cleared by the runner between
    # jobs) instead. Pinned to v0.9.0 to match what ubuntu-24.04's apt repo
    # used to ship — it's stricter on SC2015 than 0.11. Moving to a newer
    # version is a deliberate change.
    #
    # F-0704 round 3: the tarball is downloaded to a file and checked against
    # a pinned sha256 before extraction. Upstream shellcheck publishes no
    # checksums file for this release, so the hash is trust-on-first-use: it
    # was computed from two independent HTTPS fetches of this exact release
    # asset (same bytes both times) rather than trusted from a single
    # download. See the PR body for both fetches' hashes.
    runs-on: [self-hosted, home]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install shellcheck v0.9.0 (checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfLO https://github.com/koalaman/shellcheck/releases/download/v0.9.0/shellcheck-v0.9.0.linux.x86_64.tar.xz
          echo "700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f  shellcheck-v0.9.0.linux.x86_64.tar.xz" | sha256sum -c -
          tar -xJf shellcheck-v0.9.0.linux.x86_64.tar.xz
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/shellcheck-v0.9.0/shellcheck" "$RUNNER_TEMP/bin/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Show shellcheck version
        run: shellcheck --version
      - name: Run shellcheck on all shell scripts
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 --no-run-if-empty shellcheck --severity=style

  actionlint:
    name: actionlint
    # Home self-hosted runner: Go isn't preinstalled, so set it up with the
    # official action (user-space install, no sudo needed) instead of relying
    # on the ubuntu-24.04 image. Cache disabled: `go run pkg@version` has no
    # go.sum for setup-go to key on, and the shared runner disk is small
    # (~20 GB across all crew repos' jobs) — don't grow an unused cache.
    #
    # F-0704 round 3: `go-version: stable` floated to whatever Go release is
    # current on the day the job runs, which could turn the check red with no
    # repo change. Pinned to the 1.26.x minor (a currently supported Go
    # release, confirmed via https://go.dev/dl/?mode=json at implementation
    # time) instead. actionlint 1.7.7 itself stays pinned and is fetched
    # through `go run module@version`, verified against the Go checksum
    # database (sum.golang.org) — that part is unchanged.
    runs-on: [self-hosted, home]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      - name: Lint workflows
        # `go run module@version` fetches a fixed release, verified against the
        # Go checksum database (sum.golang.org).
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  gitleaks:
    name: gitleaks
    # F-0704 round 3: gitleaks/gitleaks-action@ff98106 (v2.3.9) failed outright
    # on the home runners after the self-hosted move. The round-2 comment here
    # claimed it was "a Docker container action" hitting a Docker Hub
    # pull-rate limit — that claim was wrong and unproven (this environment
    # has no `gh` access to the original failed run's log, so it is removed
    # rather than repeated). Reading the action's source at that exact commit
    # (gitleaks-action/action.yml: `runs.using: node20`; src/index.js:
    # `gitleaksVersion = process.env.GITLEAKS_VERSION || "8.24.3"`) shows it is
    # a Node action with no Docker involvement, and that it runs gitleaks
    # 8.24.3 by default with no GITLEAKS_VERSION override set in this repo.
    # We now invoke gitleaks directly, pinned to v8.30.1 (the current upstream
    # release at implementation time, and newer than the action's 8.24.3, so
    # the secret gate is at least as strict as before, never weaker). The
    # tarball is downloaded to a file and checked against a sha256 pinned
    # below that matches upstream's gitleaks_8.30.1_checksums.txt before
    # extraction. `detect` is deprecated as of 8.19; `git` is the current
    # subcommand for a full-history scan. No GITHUB_TOKEN needed.
    runs-on: [self-hosted, home]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks v8.30.1 (checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Show gitleaks version
        run: gitleaks version
      - name: Scan full history for committed secrets
        run: gitleaks git --redact -v .

  smoke:
    name: script smoke test
    runs-on: [self-hosted, home]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Syntax check every script (bash -n)
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 --no-run-if-empty -n1 bash -n
      - name: Smoke test self-test (goes red on each F-0024 failure mode)
        run: bash scripts/test-smoke-selftest.sh
      - name: Smoke each entrypoint (--help, no sudo) and README symlink targets
        run: bash scripts/test-smoke.sh
